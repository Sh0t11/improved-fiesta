<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kata Scorer</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f5f5f4;--bg3:#f0efed;
  --text:#1a1a1a;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --green:#1D9E75;--green-light:#E1F5EE;--green-dark:#0F6E56;
  --amber-bg:#FAC775;--amber-text:#633806;
  --silver-bg:#D3D1C7;--silver-text:#2C2C2A;
  --bronze-bg:#F0997B;--bronze-text:#4A1B0C;
  --red:#dc2626;--red-light:#fef2f2;
  --radius:8px;--radius-lg:12px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg3);min-height:100vh}
.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 1.25rem;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--text)}
.logo-mark{width:30px;height:30px;border-radius:7px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.spacer{flex:1}
.sync-badge{display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);color:var(--text2)}
.sync-badge.ok{color:var(--green);border-color:var(--green);background:var(--green-light)}
.sync-badge.err{color:var(--red);border-color:#fca5a5;background:var(--red-light)}
.topnav{display:flex;gap:2px}
.nav-btn{padding:6px 12px;border-radius:var(--radius);border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--text2);font-family:var(--font)}
.nav-btn:hover{background:var(--bg2);color:var(--text)}
.nav-btn.active{background:var(--bg2);color:var(--text);font-weight:500}
.main{flex:1;padding:1.5rem 1.25rem;max-width:960px;width:100%;margin:0 auto}
.page-header{margin-bottom:1.5rem}
.page-title{font-size:22px;font-weight:600;margin-bottom:3px}
.page-sub{font-size:13px;color:var(--text2)}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.card-title{font-size:15px;font-weight:600}
.card-meta{font-size:12px;color:var(--text2)}
.section-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.pill{padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--bg);cursor:pointer;font-size:13px;color:var(--text2);font-family:var(--font)}
.pill:hover{border-color:var(--green);color:var(--green)}
.pill.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.cat-tabs{display:flex;gap:0;margin-bottom:1.25rem;border-bottom:1px solid var(--border);overflow-x:auto}
.cat-tab{padding:9px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font)}
.cat-tab:hover{color:var(--text)}
.cat-tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:500}
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;gap:12px;flex-wrap:wrap}
.status-text{font-size:13px;color:var(--text2)}
.btn{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg);cursor:pointer;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:5px;font-family:var(--font)}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-rank{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--green);background:var(--green-light);cursor:pointer;font-size:13px;color:var(--green);display:inline-flex;align-items:center;gap:5px;font-weight:500;font-family:var(--font)}
.btn-rank:hover{background:var(--green);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{color:var(--red);border-color:#fca5a5}
.btn-danger:hover{background:var(--red-light)}
.flex{display:flex;gap:8px;align-items:center}
.flex-1{flex:1}
input[type=text],input[type=number],select{font-family:var(--font);font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);width:100%}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-light)}
.cat-list-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.cat-list-row:last-child{border-bottom:none}
.comp-head{display:grid;grid-template-columns:1fr repeat(5,62px) 72px 38px 32px;gap:6px;padding:0 0 8px;border-bottom:1px solid var(--border2);margin-bottom:2px}
.comp-row{display:grid;grid-template-columns:1fr repeat(5,62px) 72px 38px 32px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.comp-row:last-child{border-bottom:none}
.col-h{font-size:10px;color:var(--text2);text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.score-input{width:100%;text-align:center;padding:5px 3px;font-size:13px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--font)}
.score-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px var(--green-light)}
.score-input.is-default{color:var(--text2)}
.avg-cell{text-align:center;font-size:13px;font-weight:600;padding:5px 4px;background:var(--bg2);border-radius:var(--radius);color:var(--text)}
.rank-chip{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin:0 auto;border:1px solid var(--border);color:var(--text2);background:var(--bg)}
.rank-1{background:var(--amber-bg);border-color:var(--amber-bg);color:var(--amber-text)}
.rank-2{background:var(--silver-bg);border-color:var(--silver-bg);color:var(--silver-text)}
.rank-3{background:var(--bronze-bg);border-color:var(--bronze-bg);color:var(--bronze-text)}
.empty{text-align:center;padding:2rem 1rem;color:var(--text2);font-size:13px}
.add-row{display:flex;gap:8px;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
.no-cats{padding:2rem;text-align:center;color:var(--text2);font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg)}
.mat-badge{display:inline-block;padding:2px 7px;border-radius:10px;background:var(--bg2);font-size:11px;color:var(--text2);margin-left:6px;border:1px solid var(--border)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:15px;color:var(--text2);z-index:100}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo"><div class="logo-mark">🏆</div>Kata scorer</div>
    <div class="spacer"></div>
    <div id="syncbadge" class="sync-badge"><span class="spinner"></span> Connecting…</div>
    <div class="topnav" id="topnav"></div>
  </div>
  <div class="main" id="root"><div class="overlay"><span class="spinner"></span> Loading…</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1AzHsaQSrP_CAYJwdE2nMIMBD0anlK-0",
  authDomain: "kata-scorer-v2.firebaseapp.com",
  databaseURL: "https://kata-scorer-v2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kata-scorer-v2",
  storageBucket: "kata-scorer-v2.firebasestorage.app",
  messagingSenderId: "234952309446",
  appId: "1:234952309446:web:529df642ec8da9d95b35c7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DEFAULT_SCORE=7.0, MIN_SCORE=5.0, MAX_SCORE=9.9;

// Local UI state (not synced)
let ui = { view:'setup', activeMat:1, activeCat:null };

// Live data from Firebase
let data = { config: { matCount:2, categories:[] }, scores:{}, rankings:{} };

let syncOk = false;

// ── Firebase listeners ────────────────────────────────────────────
onValue(ref(db,'config'), snap => {
  data.config = snap.val() || { matCount:2, categories:[] };
  if(!data.config.categories) data.config.categories=[];
  setSyncOk(true);
  render();
}, () => setSyncOk(false));

onValue(ref(db,'scores'), snap => { data.scores = snap.val()||{}; render(); });
onValue(ref(db,'rankings'), snap => { data.rankings = snap.val()||{}; render(); });

function setSyncOk(ok){
  syncOk=ok;
  const el=document.getElementById('syncbadge');
  if(el) el.className='sync-badge '+(ok?'ok':'err');
  if(el) el.innerHTML=ok?'● Live':'⚠ Offline';
}

// ── Firebase writers ──────────────────────────────────────────────
function saveConfig(){ set(ref(db,'config'), data.config); }

function saveScore(matNum, catName, cmpIdx, scoreIdx, value){
  const path = `scores/mat${matNum}/${fkey(catName)}/competitors/${cmpIdx}/scores/${scoreIdx}`;
  set(ref(db, path), value);
}

function saveCompetitor(matNum, catName, cmpIdx, cmp){
  set(ref(db,`scores/mat${matNum}/${fkey(catName)}/competitors/${cmpIdx}`), cmp);
}

function saveRanking(matNum, catName, rankArr){
  set(ref(db,`rankings/mat${matNum}/${fkey(catName)}`), rankArr);
}

function removeCompetitorFromDb(matNum, catName, cmpIdx){
  // rebuild competitors array without the removed index
  const comps = getCompetitors(matNum, catName);
  comps.splice(cmpIdx,1);
  set(ref(db,`scores/mat${matNum}/${fkey(catName)}/competitors`), comps.length ? comps : null);
  // clear ranking
  set(ref(db,`rankings/mat${matNum}/${fkey(catName)}`), null);
}

// ── Helpers ───────────────────────────────────────────────────────
function fkey(s){ return s.replace(/[.#$\[\]\/]/g,'_'); }
function esc(s){ return (s||'').replace(/\W/g,'_'); }

function getCompetitors(m, cat){
  const raw = data.scores?.[`mat${m}`]?.[fkey(cat)]?.competitors;
  if(!raw) return [];
  // Firebase returns objects with numeric keys when array
  if(Array.isArray(raw)) return raw.filter(x=>x);
  return Object.keys(raw).sort((a,b)=>a-b).map(k=>raw[k]).filter(x=>x);
}

function getRankings(m, cat){
  const r = data.rankings?.[`mat${m}`]?.[fkey(cat)];
  if(!r) return [];
  if(Array.isArray(r)) return r;
  return Object.keys(r).sort((a,b)=>a-b).map(k=>r[k]);
}

function calcAvg(scores){
  if(!scores) return null;
  const arr = Array.isArray(scores)?scores:Object.values(scores);
  const v = arr.filter(s=>s!==null&&s!==''&&s!==undefined);
  if(!v.length) return null;
  return (v.reduce((a,b)=>a+parseFloat(b),0)/v.length).toFixed(2);
}

function fullyScored(scores){
  if(!scores) return false;
  const arr = Array.isArray(scores)?scores:Object.values(scores);
  return arr.filter(s=>s!==null&&s!==''&&s!==undefined).length===5;
}

function catsForMat(m){ return (data.config.categories||[]).filter(c=>c.mat===m); }

// ── Render ────────────────────────────────────────────────────────
function render(){
  document.getElementById('topnav').innerHTML = buildNav();
  document.getElementById('root').innerHTML =
    ui.view==='setup' ? buildSetup() :
    ui.view==='scoring' ? buildScoring() : '';
}

function buildNav(){
  return [['setup','⚙','Setup'],['scoring','✏','Scoring']].map(([v,ic,label])=>
    `<button class="nav-btn${ui.view===v?' active':''}" onclick="go('${v}')">${ic} ${label}</button>`
  ).join('');
}

window.go = function(v){
  if(v==='scoring'){
    const mc=catsForMat(ui.activeMat);
    if(!ui.activeCat||!mc.find(c=>c.name===ui.activeCat)) ui.activeCat=mc.length?mc[0].name:null;
  }
  ui.view=v; render();
};

// ── Setup view ────────────────────────────────────────────────────
function buildSetup(){
  const cats = (data.config.categories||[]).map((c,i)=>
    `<div class="cat-list-row">
      <span style="font-size:13px;font-weight:500">${c.name}</span>
      <select style="width:100px" onchange="setCatMat(${i},parseInt(this.value))">${
        Array.from({length:data.config.matCount||2},(_,j)=>
          `<option value="${j+1}"${c.mat===j+1?' selected':''}>Mat ${j+1}</option>`
        ).join('')
      }</select>
      <button class="btn btn-sm btn-danger" onclick="removeCat(${i})">✕</button>
    </div>`
  ).join('');

  const matOpts = Array.from({length:data.config.matCount||2},(_,i)=>
    `<option value="${i+1}">Mat ${i+1}</option>`).join('');

  return `<div class="page-header"><div class="page-title">Competition setup</div><div class="page-sub">Changes sync to all connected devices instantly</div></div>
  <div class="card">
    <div class="card-header"><span class="card-title">Mats / rings</span></div>
    <div class="section-label">Number of simultaneous mats</div>
    <div class="pills">${[1,2,3,4,5].map(n=>`<button class="pill${(data.config.matCount||2)===n?' active':''}" onclick="setMats(${n})">${n} mat${n>1?'s':''}</button>`).join('')}</div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">Categories</span><span class="card-meta">Assign each to a mat</span></div>
    ${cats||'<div class="empty">No categories yet — add one below</div>'}
    <div class="add-row">
      <input type="text" id="newCatName" placeholder="Category name, e.g. Junior Male" class="flex-1" onkeydown="if(event.key==='Enter')addCat()" />
      <select id="newCatMat" style="width:100px">${matOpts}</select>
      <button class="btn btn-primary" onclick="addCat()">+ Add</button>
    </div>
  </div>
  <div style="display:flex;justify-content:flex-end">
    <button class="btn btn-primary" onclick="go('scoring')" ${(data.config.categories||[]).length===0?'disabled':''}>▶ Start scoring</button>
  </div>`;
}

window.setMats = function(n){
  data.config.matCount=n;
  (data.config.categories||[]).forEach(c=>{ if(c.mat>n) c.mat=n; });
  saveConfig(); render();
};

window.addCat = function(){
  const name = document.getElementById('newCatName')?.value?.trim();
  const mat = parseInt(document.getElementById('newCatMat')?.value||'1');
  if(!name) return;
  if(!(data.config.categories||[]).find(c=>c.name===name)){
    if(!data.config.categories) data.config.categories=[];
    data.config.categories.push({name,mat});
    saveConfig();
  }
  render();
};

window.removeCat = function(i){
  data.config.categories.splice(i,1);
  saveConfig(); render();
};

window.setCatMat = function(i,m){
  data.config.categories[i].mat=m;
  saveConfig(); render();
};

// ── Scoring view ──────────────────────────────────────────────────
function buildScoring(){
  const m = ui.activeMat;
  const matCats = catsForMat(m);
  if(!ui.activeCat||!matCats.find(c=>c.name===ui.activeCat))
    ui.activeCat = matCats.length ? matCats[0].name : null;
  const cat = ui.activeCat;

  const matPills = Array.from({length:data.config.matCount||2},(_,i)=>i+1).map(n=>
    `<button class="pill${m===n?' active':''}" onclick="setActiveMat(${n})">Mat ${n} <span style="font-size:11px;opacity:.7">(${catsForMat(n).length})</span></button>`
  ).join('');

  if(!cat||!matCats.length){
    return `<div class="page-header"><div class="page-title">Live scoring</div></div>
    <div class="pills">${matPills}</div>
    <div class="no-cats">No categories assigned to Mat ${m}. Go to ⚙ Setup to assign categories.</div>`;
  }

  const catTabs = matCats.map(c=>
    `<button class="cat-tab${cat===c.name?' active':''}" onclick="setActiveCat('${c.name.replace(/'/g,"\\'")}')">${c.name}</button>`
  ).join('');

  const comps = getCompetitors(m, cat);
  const sr = getRankings(m, cat);
  const allWithIdx = comps.map((x,i)=>({...x,_idx:i,av:calcAvg(x.scores)}));
  const disp = sr.length>0
    ? [...sr.map(i=>allWithIdx[i]).filter(Boolean), ...allWithIdx.filter(x=>!sr.includes(x._idx))]
    : allWithIdx;

  const total=allWithIdx.length;
  const fully=allWithIdx.filter(x=>fullyScored(x.scores)).length;
  let ti=1;

  const rows = disp.length ? disp.map(c=>{
    const rank = sr.length>0 ? sr.indexOf(c._idx) : -1;
    const scoreArr = Array.isArray(c.scores) ? c.scores : [null,null,null,null,null];
    const inputs = [0,1,2,3,4].map(j=>{
      const val=scoreArr[j]; const empty=val===null||val===undefined||val==='';
      const isDef=!empty&&parseFloat(val)===DEFAULT_SCORE;
      return `<input type="number" class="score-input${isDef?' is-default':''}" min="${MIN_SCORE}" max="${MAX_SCORE}" step="0.1"
        value="${empty?'':parseFloat(val).toFixed(1)}" placeholder="—" tabindex="${ti++}"
        data-cidx="${c._idx}" data-sidx="${j}"
        onfocus="onFocus(this,${c._idx},${j})"
        onchange="onChange(this,${c._idx},${j})"
        onblur="onBlur(this,${c._idx},${j})"
        onkeydown="onKey(event,${c._idx},${j})" />`;
    }).join('');
    const chip = rank>=0
      ? (rank<3?`<div class="rank-chip rank-${rank+1}">${rank+1}</div>`:`<div class="rank-chip">${rank+1}</div>`)
      : `<div class="rank-chip" style="font-size:10px">—</div>`;
    return `<div class="comp-row">
      <span style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</span>
      ${inputs}
      <div class="avg-cell" id="av-${m}-${esc(cat)}-${c._idx}">${c.av??'—'}</div>
      ${chip}
      <button class="btn btn-sm btn-danger" style="padding:4px 7px" onclick="removeCmp(${c._idx})">✕</button>
    </div>`;
  }).join('') : `<div class="empty">No competitors yet — add names below</div>`;

  return `<div class="page-header"><div class="page-title">Live scoring</div></div>
  <div class="pills">${matPills}</div>
  <div class="cat-tabs">${catTabs}</div>
  <div class="status-bar">
    <span class="status-text" id="status-inner">📋 ${fully} of ${total} competitor${total!==1?'s':''} fully scored — rankings update only when you click the button</span>
    <button class="btn-rank" onclick="updateRanking()">↻ Update ranking</button>
  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-title">Mat ${m} — ${cat}</span>
      <span class="card-meta">${total} competitor${total!==1?'s':''}</span>
    </div>
    <div class="comp-head">
      <span class="col-h" style="text-align:left">Competitor</span>
      <span class="col-h">Judge 1</span><span class="col-h">Judge 2</span><span class="col-h">Judge 3</span><span class="col-h">Judge 4</span><span class="col-h">Judge 5</span>
      <span class="col-h">Average</span><span class="col-h">Rank</span><span></span>
    </div>
    <div id="comp-list">${rows}</div>
    <div class="add-row">
      <input type="text" id="newName" placeholder="Competitor name" class="flex-1" onkeydown="if(event.key==='Enter')addCmp()" />
      <button class="btn btn-primary" onclick="addCmp()">+ Add</button>
    </div>
  </div>`;
}

window.setActiveMat = function(m){
  ui.activeMat=m;
  const mc=catsForMat(m);
  ui.activeCat=mc.length?mc[0].name:null;
  render();
};

window.setActiveCat = function(c){ ui.activeCat=c; render(); };

window.onFocus = function(input,ci,si){
  const comps=getCompetitors(ui.activeMat,ui.activeCat);
  const c=comps[ci]; if(!c) return;
  const scores=Array.isArray(c.scores)?[...c.scores]:[null,null,null,null,null];
  if(scores[si]===null||scores[si]===undefined||scores[si]===''){
    input.value=DEFAULT_SCORE.toFixed(1);
    input.classList.add('is-default');
    saveScore(ui.activeMat,ui.activeCat,ci,si,DEFAULT_SCORE);
  }
  setTimeout(()=>input.select(),0);
};

window.onChange = function(input,ci,si){
  let v=parseFloat(input.value); if(isNaN(v)) v=DEFAULT_SCORE;
  v=Math.min(MAX_SCORE,Math.max(MIN_SCORE,Math.round(v*10)/10));
  input.value=v.toFixed(1);
  input.classList.toggle('is-default',v===DEFAULT_SCORE);
  saveScore(ui.activeMat,ui.activeCat,ci,si,v);
  refreshAvgLocal(ci,si,v);
};

window.onBlur = function(input,ci,si){
  let v=parseFloat(input.value);
  if(isNaN(v)){v=DEFAULT_SCORE;input.value=DEFAULT_SCORE.toFixed(1);input.classList.add('is-default');}
  else{ v=Math.min(MAX_SCORE,Math.max(MIN_SCORE,Math.round(v*10)/10)); input.value=v.toFixed(1); input.classList.toggle('is-default',v===DEFAULT_SCORE); }
  saveScore(ui.activeMat,ui.activeCat,ci,si,v);
  refreshAvgLocal(ci,si,v);
};

window.onKey = function(e,ci,si){ if(e.key==='Enter'){e.preventDefault();focusNext(ci,si);} };

function focusNext(ci,si){
  if(si<4){const n=document.querySelector(`input[data-cidx="${ci}"][data-sidx="${si+1}"]`);if(n){n.focus();return;}}
  const n=document.querySelector(`input[data-cidx="${ci+1}"][data-sidx="0"]`);if(n){n.focus();return;}
  document.getElementById('newName')?.focus();
}

function refreshAvgLocal(ci,si,newVal){
  // Read all current input values for this competitor to compute avg without waiting for Firebase
  const inputs=[0,1,2,3,4].map(j=>{
    if(j===si) return newVal;
    const el=document.querySelector(`input[data-cidx="${ci}"][data-sidx="${j}"]`);
    return el&&el.value!==''?parseFloat(el.value):null;
  });
  const v=inputs.filter(x=>x!==null);
  const avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):null;
  const el=document.getElementById(`av-${ui.activeMat}-${esc(ui.activeCat)}-${ci}`);
  if(el) el.textContent=avg??'—';
}

window.updateRanking = function(){
  const m=ui.activeMat,cat=ui.activeCat;
  const comps=getCompetitors(m,cat);
  const ranked=[...comps].map((x,i)=>({...x,_idx:i,av:calcAvg(x.scores)}))
    .sort((a,b)=>{
      if(b.av===null&&a.av===null)return 0;
      if(a.av===null)return 1; if(b.av===null)return-1;
      return parseFloat(b.av)-parseFloat(a.av);
    });
  saveRanking(m,cat,ranked.map(x=>x._idx));
};

window.addCmp = function(){
  const input=document.getElementById('newName');
  const name=input?.value?.trim(); if(!name) return;
  const comps=getCompetitors(ui.activeMat,ui.activeCat);
  const newIdx=comps.length;
  saveCompetitor(ui.activeMat,ui.activeCat,newIdx,{name,scores:[null,null,null,null,null]});
  input.value='';
  setTimeout(()=>{
    const f=document.querySelector(`input[data-cidx="${newIdx}"][data-sidx="0"]`);
    if(f) f.focus();
  },400);
};

window.removeCmp = function(idx){
  removeCompetitorFromDb(ui.activeMat,ui.activeCat,idx);
};

</script>
</body>
