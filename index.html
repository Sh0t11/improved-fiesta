
<style>
:root{
  --bg:#ffffff;--bg2:#f5f5f4;--bg3:#f0efed;
  --text:#1a1a1a;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --green:#1D9E75;--green-light:#E1F5EE;--green-dark:#0F6E56;
  --amber-bg:#FAC775;--amber-text:#633806;
  --silver-bg:#D3D1C7;--silver-text:#2C2C2A;
  --bronze-bg:#F0997B;--bronze-text:#4A1B0C;
  --red:#dc2626;--red-light:#fef2f2;
  --radius:8px;--radius-lg:12px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg3);min-height:100vh}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:0 1.25rem;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--text)}
.logo-mark{width:30px;height:30px;border-radius:7px;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.spacer{flex:1}
.topnav{display:flex;gap:2px}
.nav-btn{padding:6px 12px;border-radius:var(--radius);border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:5px;font-family:var(--font)}
.nav-btn:hover{background:var(--bg2);color:var(--text)}
.nav-btn.active{background:var(--bg2);color:var(--text);font-weight:500}
.main{flex:1;padding:1.5rem 1.25rem;max-width:960px;width:100%;margin:0 auto}
.page-header{margin-bottom:1.5rem}
.page-title{font-size:22px;font-weight:600;margin-bottom:3px;color:var(--text)}
.page-sub{font-size:13px;color:var(--text2)}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.card-title{font-size:15px;font-weight:600;color:var(--text)}
.card-meta{font-size:12px;color:var(--text2)}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem}
.metric{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem}
.metric-label{font-size:12px;color:var(--text2);margin-bottom:4px}
.metric-value{font-size:26px;font-weight:600;color:var(--text)}
.section-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.pill{padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--bg);cursor:pointer;font-size:13px;color:var(--text2);font-family:var(--font)}
.pill:hover{border-color:var(--green);color:var(--green)}
.pill.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}
.cat-tabs{display:flex;gap:0;margin-bottom:1.25rem;border-bottom:1px solid var(--border);overflow-x:auto}
.cat-tab{padding:9px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-family:var(--font)}
.cat-tab:hover{color:var(--text)}
.cat-tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:500}
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;gap:12px}
.status-text{font-size:13px;color:var(--text2)}
.btn{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg);cursor:pointer;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:5px;font-family:var(--font)}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-rank{padding:7px 14px;border-radius:var(--radius);border:1px solid var(--green);background:var(--green-light);cursor:pointer;font-size:13px;color:var(--green);display:inline-flex;align-items:center;gap:5px;font-weight:500;font-family:var(--font)}
.btn-rank:hover{background:var(--green);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{color:var(--red);border-color:#fca5a5}
.btn-danger:hover{background:var(--red-light)}
.flex{display:flex;gap:8px;align-items:center}
.flex-1{flex:1}
input[type=text],input[type=number],select{font-family:var(--font);font-size:13px;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);width:100%}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-light)}
.cat-list-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.cat-list-row:last-child{border-bottom:none}
.mat-chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;background:var(--green-light);color:var(--green);border:1px solid var(--green)}
.comp-head{display:grid;grid-template-columns:1fr repeat(5,62px) 72px 38px 32px;gap:6px;padding:0 0 8px;border-bottom:1px solid var(--border2);margin-bottom:2px}
.comp-row{display:grid;grid-template-columns:1fr repeat(5,62px) 72px 38px 32px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.comp-row:last-child{border-bottom:none}
.col-h{font-size:10px;color:var(--text2);text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.score-input{width:100%;text-align:center;padding:5px 3px;font-size:13px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:var(--font)}
.score-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px var(--green-light)}
.score-input.is-default{color:var(--text2)}
.avg-cell{text-align:center;font-size:13px;font-weight:600;padding:5px 4px;background:var(--bg2);border-radius:var(--radius);color:var(--text)}
.rank-chip{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin:0 auto;border:1px solid var(--border);color:var(--text2);background:var(--bg)}
.rank-1{background:var(--amber-bg);border-color:var(--amber-bg);color:var(--amber-text)}
.rank-2{background:var(--silver-bg);border-color:var(--silver-bg);color:var(--silver-text)}
.rank-3{background:var(--bronze-bg);border-color:var(--bronze-bg);color:var(--bronze-text)}
.empty{text-align:center;padding:2rem 1rem;color:var(--text2);font-size:13px}
.add-row{display:flex;gap:8px;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}
.res-row{display:grid;grid-template-columns:44px 1fr 80px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.res-row:last-child{border-bottom:none}
.mat-badge{display:inline-block;padding:2px 7px;border-radius:10px;background:var(--bg2);font-size:11px;color:var(--text2);margin-left:6px;border:1px solid var(--border)}
.no-cats{padding:2rem;text-align:center;color:var(--text2);font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg)}
</style>

<h2 class="sr-only">Karate Kata Competition Scoring — enter judge scores and view live rankings across mats and categories.</h2>
<div class="shell">
  <div class="topbar">
    <div class="logo"><div class="logo-mark">🏆</div>Kata scorer</div>
    <div class="spacer"></div>
    <div class="topnav" id="topnav"></div>
  </div>
  <div class="main" id="root"></div>
</div>

<script>
const DEFAULT_SCORE=7.0,MIN_SCORE=5.0,MAX_SCORE=9.9;

let state={
  view:'setup',
  categories:[
    {name:'Junior Male',mat:1},
    {name:'Junior Female',mat:1},
    {name:'Senior Male',mat:2},
    {name:'Senior Female',mat:2}
  ],
  matCount:2,
  mats:{},
  activeMat:1,
  activeCat:null,
  rankings:{}
};

function matData(m,c){if(!state.mats[m])state.mats[m]={};if(!state.mats[m][c])state.mats[m][c]={competitors:[]};return state.mats[m][c]}
function rkey(m,c){return m+'||'+c}
function storedRanks(m,c){return state.rankings[rkey(m,c)]||[]}
function calcAvg(scores){const v=scores.filter(s=>s!==null&&s!=='');if(!v.length)return null;return(v.reduce((a,b)=>a+parseFloat(b),0)/v.length).toFixed(2)}
function fullyScored(scores){return scores.filter(s=>s!==null&&s!=='').length===5}
function esc(s){return(s||'').replace(/\W/g,'_')}
function catsForMat(m){return state.categories.filter(c=>c.mat===m)}

function render(){
  document.getElementById('topnav').innerHTML=buildNav();
  document.getElementById('root').innerHTML=
    state.view==='setup'?buildSetup():
    state.view==='scoring'?buildScoring():
    buildResults();
}

function buildNav(){
  return[['setup','⚙','Setup'],['scoring','✏','Scoring'],['results','📊','Results']].map(([v,ic,label])=>
    `<button class="nav-btn${state.view===v?' active':''}" onclick="go('${v}')">${ic} ${label}</button>`
  ).join('');
}

function go(v){
  if(v==='scoring'){
    const matCats=catsForMat(state.activeMat);
    if(!state.activeCat||!matCats.find(c=>c.name===state.activeCat)){
      state.activeCat=matCats.length?matCats[0].name:null;
    }
  }
  state.view=v;render();
}

function buildSetup(){
  const matOptions=Array.from({length:state.matCount},(_,i)=>
    `<option value="${i+1}">Mat ${i+1}</option>`
  ).join('');

  const catRows=state.categories.map((c,i)=>
    `<div class="cat-list-row">
      <span style="font-size:13px;font-weight:500">${c.name}</span>
      <select style="width:100px" onchange="setCatMat(${i},parseInt(this.value))">${
        Array.from({length:state.matCount},(_,j)=>
          `<option value="${j+1}"${c.mat===j+1?' selected':''}>Mat ${j+1}</option>`
        ).join('')
      }</select>
      <button class="btn btn-sm btn-danger" onclick="removeCat(${i})" aria-label="Remove">✕</button>
    </div>`
  ).join('');

  return`<div class="page-header"><div class="page-title">Competition setup</div><div class="page-sub">Assign each category to a mat, then start the competition</div></div>
  <div class="card">
    <div class="card-header"><span class="card-title">Mats / rings</span></div>
    <div class="section-label">Number of simultaneous mats</div>
    <div class="pills">${[1,2,3,4,5].map(n=>`<button class="pill${state.matCount===n?' active':''}" onclick="setMats(${n})">${n} mat${n>1?'s':''}</button>`).join('')}</div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">Categories</span><span class="card-meta">Assign each to a mat</span></div>
    ${catRows||'<div class="empty">No categories yet</div>'}
    <div class="add-row">
      <input type="text" id="newCatName" placeholder="Category name, e.g. Cadet Female" class="flex-1" onkeydown="if(event.key==='Enter')addCat()" />
      <select id="newCatMat" style="width:100px">${matOptions}</select>
      <button class="btn btn-primary" onclick="addCat()">+ Add</button>
    </div>
  </div>
  <div style="display:flex;justify-content:flex-end">
    <button class="btn btn-primary" onclick="go('scoring')" ${state.categories.length===0?'disabled':''}>▶ Start competition</button>
  </div>`;
}

function buildScoring(){
  const m=state.activeMat;
  const matCats=catsForMat(m);

  if(!state.activeCat||!matCats.find(c=>c.name===state.activeCat)){
    state.activeCat=matCats.length?matCats[0].name:null;
  }
  const cat=state.activeCat;

  const matPills=Array.from({length:state.matCount},(_,i)=>i+1).map(n=>
    `<button class="pill${m===n?' active':''}" onclick="setActiveMat(${n})">Mat ${n} <span style="font-size:11px;opacity:.7">(${catsForMat(n).length})</span></button>`
  ).join('');

  const catTabs=matCats.map(c=>
    `<button class="cat-tab${cat===c.name?' active':''}" onclick="setActiveCat('${c.name.replace(/'/g,"\\'")}')">${c.name}</button>`
  ).join('');

  if(!cat||!matCats.length){
    return`<div class="page-header"><div class="page-title">Live scoring</div></div>
    <div class="pills">${matPills}</div>
    <div class="no-cats">No categories assigned to Mat ${m}. Go to Setup to assign categories.</div>`;
  }

  const data=matData(m,cat);
  const sr=storedRanks(m,cat);
  const all=data.competitors.map((x,i)=>({...x,_idx:i,av:calcAvg(x.scores)}));
  const disp=sr.length>0?[...sr.map(i=>all[i]).filter(Boolean),...all.filter(x=>!sr.includes(x._idx))]:all;
  const total=all.length,fully=all.filter(x=>fullyScored(x.scores)).length;
  let ti=1;

  const rows=disp.length?disp.map(c=>{
    const rank=sr.length>0?sr.indexOf(c._idx):-1;
    const inputs=[0,1,2,3,4].map(j=>{
      const val=c.scores[j];const empty=val===null||val==='';const isDef=!empty&&parseFloat(val)===DEFAULT_SCORE;
      return`<input type="number" class="score-input${isDef?' is-default':''}" min="${MIN_SCORE}" max="${MAX_SCORE}" step="0.1" value="${empty?'':val}" placeholder="—" tabindex="${ti++}" data-cidx="${c._idx}" data-sidx="${j}" onfocus="onFocus(this,${c._idx},${j})" onchange="onChange(this,${c._idx},${j})" onblur="onBlur(this,${c._idx},${j})" onkeydown="onKey(event,${c._idx},${j})" />`;
    }).join('');
    const chip=rank>=0?(rank<3?`<div class="rank-chip rank-${rank+1}">${rank+1}</div>`:`<div class="rank-chip">${rank+1}</div>`):`<div class="rank-chip" style="font-size:10px">—</div>`;
    return`<div class="comp-row"><span style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</span>${inputs}<div class="avg-cell" id="av-${m}-${esc(cat)}-${c._idx}">${c.av??'—'}</div>${chip}<button class="btn btn-sm btn-danger" style="padding:4px 7px" onclick="removeCmp(${c._idx})" aria-label="Remove">✕</button></div>`;
  }).join(''):`<div class="empty">No competitors yet — add names below</div>`;

  return`<div class="page-header"><div class="page-title">Live scoring</div></div>
  <div class="pills">${matPills}</div>
  <div class="cat-tabs">${catTabs}</div>
  <div class="status-bar">
    <span class="status-text" id="status-inner">📋 ${fully} of ${total} competitor${total!==1?'s':''} fully scored — rankings update only when you click the button</span>
    <button class="btn-rank" onclick="updateRanking()">↻ Update ranking</button>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">Mat ${m} — ${cat}</span><span class="card-meta">${total} competitor${total!==1?'s':''}</span></div>
    <div class="comp-head">
      <span class="col-h" style="text-align:left">Competitor</span>
      <span class="col-h">Judge 1</span><span class="col-h">Judge 2</span><span class="col-h">Judge 3</span><span class="col-h">Judge 4</span><span class="col-h">Judge 5</span>
      <span class="col-h">Average</span><span class="col-h">Rank</span><span></span>
    </div>
    <div id="comp-list">${rows}</div>
    <div class="add-row"><input type="text" id="newName" placeholder="Competitor name" class="flex-1" onkeydown="if(event.key==='Enter')addCmp()" /><button class="btn btn-primary" onclick="addCmp()">+ Add</button></div>
  </div>`;
}

function buildResults(){
  let total=0;
  for(let m=1;m<=state.matCount;m++)state.categories.filter(c=>c.mat===m).forEach(c=>{total+=matData(m,c.name).competitors.filter(x=>calcAvg(x.scores)!==null).length});
  const tables=state.categories.map(cat=>{
    const m=cat.mat;const rows=[];
    const sr=storedRanks(m,cat.name);const data=matData(m,cat.name);
    const comps=data.competitors.map((c,i)=>({...c,_idx:i,av:calcAvg(c.scores)}));
    if(sr.length>0){
      sr.forEach(idx=>{const c=comps[idx];if(c&&c.av!==null)rows.push({name:c.name,av:c.av,mat:m})});
      comps.filter(c=>!sr.includes(c._idx)&&c.av!==null).forEach(c=>rows.push({name:c.name,av:c.av,mat:m,u:true}));
    } else comps.filter(c=>c.av!==null).sort((a,b)=>parseFloat(b.av)-parseFloat(a.av)).forEach(c=>rows.push({name:c.name,av:c.av,mat:m}));
    if(!rows.length)return'';
    return`<div class="card">
      <div class="card-header"><span class="card-title">${cat.name}</span><span class="card-meta"><span class="mat-badge">Mat ${m}</span> &nbsp;${rows.length} competitor${rows.length!==1?'s':''}</span></div>
      ${rows.map((r,i)=>{
        const chip=i<3?`<div class="rank-chip rank-${i+1}">${i+1}</div>`:`<div class="rank-chip">${i+1}</div>`;
        return`<div class="res-row">${chip}<span style="font-size:13px">${r.name}${r.u?'<span style="font-size:11px;color:var(--text2)"> · unranked</span>':''}</span><span style="font-weight:600;font-size:14px;text-align:right">${r.av}</span></div>`;
      }).join('')}
    </div>`;
  }).join('');
  return`<div class="page-header"><div class="page-title">Results</div><div class="page-sub">Ranked by average score within each category</div></div>
  <div class="metric-grid">
    <div class="metric"><div class="metric-label">Competitors scored</div><div class="metric-value">${total}</div></div>
    <div class="metric"><div class="metric-label">Categories</div><div class="metric-value">${state.categories.length}</div></div>
    <div class="metric"><div class="metric-label">Active mats</div><div class="metric-value">${state.matCount}</div></div>
  </div>
  ${tables||'<div class="empty">No scores entered yet</div>'}
  <div style="display:flex;justify-content:flex-end;margin-top:.5rem"><button class="btn" onclick="exportCSV()">⬇ Export CSV</button></div>`;
}

function onFocus(input,ci,si){
  const data=matData(state.activeMat,state.activeCat);const c=data.competitors[ci];if(!c)return;
  if(c.scores[si]===null||c.scores[si]===''){c.scores[si]=DEFAULT_SCORE;input.value=DEFAULT_SCORE.toFixed(1);input.classList.add('is-default')}
  setTimeout(()=>input.select(),0);
}
function onChange(input,ci,si){
  const data=matData(state.activeMat,state.activeCat);const c=data.competitors[ci];if(!c)return;
  let v=parseFloat(input.value);if(isNaN(v))v=DEFAULT_SCORE;
  v=Math.min(MAX_SCORE,Math.max(MIN_SCORE,Math.round(v*10)/10));
  input.value=v.toFixed(1);c.scores[si]=v;input.classList.toggle('is-default',v===DEFAULT_SCORE);
  refreshAvg(ci);refreshStatus();
}
function onBlur(input,ci,si){
  const data=matData(state.activeMat,state.activeCat);const c=data.competitors[ci];if(!c)return;
  let v=parseFloat(input.value);
  if(isNaN(v)){c.scores[si]=DEFAULT_SCORE;input.value=DEFAULT_SCORE.toFixed(1);input.classList.add('is-default');return}
  v=Math.min(MAX_SCORE,Math.max(MIN_SCORE,Math.round(v*10)/10));
  input.value=v.toFixed(1);c.scores[si]=v;input.classList.toggle('is-default',v===DEFAULT_SCORE);
  refreshAvg(ci);refreshStatus();
}
function onKey(e,ci,si){if(e.key==='Enter'){e.preventDefault();focusNext(ci,si)}}
function focusNext(ci,si){
  if(si<4){const n=document.querySelector(`input[data-cidx="${ci}"][data-sidx="${si+1}"]`);if(n){n.focus();return}}
  const n=document.querySelector(`input[data-cidx="${ci+1}"][data-sidx="0"]`);if(n){n.focus();return}
  document.getElementById('newName')?.focus();
}
function refreshAvg(ci){
  const data=matData(state.activeMat,state.activeCat);const c=data.competitors[ci];if(!c)return;
  const el=document.getElementById(`av-${state.activeMat}-${esc(state.activeCat)}-${ci}`);
  if(el)el.textContent=calcAvg(c.scores)??'—';
}
function refreshStatus(){
  const data=matData(state.activeMat,state.activeCat);const t=data.competitors.length;
  const f=data.competitors.filter(c=>fullyScored(c.scores)).length;
  const el=document.getElementById('status-inner');
  if(el)el.textContent=`📋 ${f} of ${t} competitor${t!==1?'s':''} fully scored — rankings update only when you click the button`;
}
function updateRanking(){
  const m=state.activeMat,c=state.activeCat;const data=matData(m,c);
  const ranked=[...data.competitors].map((x,i)=>({...x,_idx:i,av:calcAvg(x.scores)}))
    .sort((a,b)=>{if(b.av===null&&a.av===null)return 0;if(a.av===null)return 1;if(b.av===null)return-1;return parseFloat(b.av)-parseFloat(a.av)});
  state.rankings[rkey(m,c)]=ranked.map(x=>x._idx);render();
}
function addCat(){
  const name=document.getElementById('newCatName')?.value?.trim();
  const mat=parseInt(document.getElementById('newCatMat')?.value||'1');
  if(name&&!state.categories.find(c=>c.name===name)){state.categories.push({name,mat})}
  render();
}
function removeCat(i){state.categories.splice(i,1);render()}
function setCatMat(i,m){state.categories[i].mat=m;render()}
function setMats(n){
  state.matCount=n;
  state.categories.forEach(c=>{if(c.mat>n)c.mat=n});
  render();
}
function setActiveMat(m){
  state.activeMat=m;
  const matCats=catsForMat(m);
  state.activeCat=matCats.length?matCats[0].name:null;
  render();
}
function setActiveCat(c){state.activeCat=c;render()}
function addCmp(){
  const input=document.getElementById('newName');const name=input?.value?.trim();if(!name)return;
  const data=matData(state.activeMat,state.activeCat);data.competitors.push({name,scores:[null,null,null,null,null]});render();
  setTimeout(()=>{const f=document.querySelector(`input[data-cidx="${data.competitors.length-1}"][data-sidx="0"]`);if(f)f.focus()},50);
}
function removeCmp(idx){
  const data=matData(state.activeMat,state.activeCat);data.competitors.splice(idx,1);
  const k=rkey(state.activeMat,state.activeCat);
  state.rankings[k]=(state.rankings[k]||[]).filter(i=>i!==idx).map(i=>i>idx?i-1:i);render();
}
function exportCSV(){
  let csv='Mat,Category,Competitor,J1,J2,J3,J4,J5,Average,Rank\n';
  state.categories.forEach(cat=>{
    const m=cat.mat;const sr=storedRanks(m,cat.name);const data=matData(m,cat.name);
    const comps=data.competitors.map((c,i)=>({...c,_idx:i,av:calcAvg(c.scores)}));
    const rows=[];
    if(sr.length>0)sr.forEach((idx,rank)=>{const c=comps[idx];if(c)rows.push({...c,mat:m,rank:rank+1})});
    else comps.filter(c=>c.av!==null).sort((a,b)=>parseFloat(b.av)-parseFloat(a.av)).forEach((c,i)=>rows.push({...c,mat:m,rank:i+1}));
    rows.forEach(c=>{csv+=`${c.mat},"${cat.name}","${c.name}",${c.scores.map(s=>s===null?'':s).join(',')},${c.av??''},${c.rank}\n`});
  });
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='kata_scores.csv';a.click();URL.revokeObjectURL(url);
}
render();
</script>
